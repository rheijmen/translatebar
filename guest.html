<!doctype html>
<!-- Zero-install guest view. The relay serves this page to plain browser GETs
     on the tunnel URL; the room key travels in the #fragment (never sent to
     the server in the HTTP request). The page joins the room over the same
     host's WebSocket and renders incoming captions — read-only: full two-way
     translation still needs the app. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TranslateBar</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --edge:#30363a;
    --green:#3fb950; --caption:#7ee787; --dim:#6e7681; --text:#c9d1d9;
    --amber:#d29922; --red:#f85149;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Noto Sans",sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:center; gap:10px;
    padding:12px 16px; border-bottom:2px solid var(--edge);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim);
  }
  header .brand{color:var(--text); font-weight:700;}
  main{
    flex:1; display:flex; flex-direction:column; justify-content:flex-end;
    padding:20px 18px; overflow:hidden;
  }
  #caps{
    font-size:clamp(22px,4.5vw,34px); font-weight:700; line-height:1.4;
    color:var(--caption); overflow-wrap:break-word;
    display:flex; flex-direction:column; justify-content:flex-end;
    max-height:100%; overflow:hidden;
  }
  #caps .old{color:var(--dim); font-weight:400;}
  #hint{color:var(--dim); font-size:15px; font-weight:400; line-height:1.6;}
  #hint code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    background:var(--panel); padding:1px 6px;
  }
  footer{
    display:flex; align-items:center; gap:8px;
    padding:10px 16px; border-top:2px solid var(--edge);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim);
  }
  #dot{width:9px; height:9px; background:var(--amber); flex:none;}
  #dot.on{background:var(--green);}
  #dot.err{background:var(--red);}
  footer a{color:var(--dim);}
</style>
</head>
<body>
  <header><span class="brand">TranslateBar</span><span>guest view</span></header>
  <main>
    <div id="caps"><div id="hint">Connecting to the meeting…</div></div>
  </main>
  <footer><span id="dot"></span><span id="status">pairing…</span>
    <span style="margin-left:auto">read-only — two-way needs
      <a href="https://github.com/rheijmen/translatebar">the app</a></span></footer>
<script>
(function(){
  var room = (location.hash || "").replace(/^#/, "").trim();
  var caps = document.getElementById("caps");
  var hint = document.getElementById("hint");
  var dot = document.getElementById("dot");
  var status = document.getElementById("status");
  var finals = [];              // last few finished captions (dimmed)
  var partial = "";             // the caption being spoken right now
  var KEEP = 3;                 // finished lines kept on screen

  if (!room){
    hint.innerHTML = "This link is missing its room. Ask your host for a fresh " +
                     "invitation — the link ends in <code>#…</code>.";
    dot.className = "err"; status.textContent = "no room";
    return;
  }

  function render(){
    if (!finals.length && !partial) return;
    var html = "";
    for (var i = 0; i < finals.length; i++)
      html += '<div class="old"></div>';
    caps.innerHTML = html + (partial ? "<div></div>" : "");
    var nodes = caps.querySelectorAll("div");
    for (var j = 0; j < finals.length; j++) nodes[j].textContent = finals[j];
    if (partial) nodes[nodes.length - 1].textContent = partial;
  }

  var backoff = 1000;
  function connect(){
    var proto = location.protocol === "https:" ? "wss://" : "ws://";
    var ws;
    try { ws = new WebSocket(proto + location.host); }
    catch (e) { return retry(); }
    ws.onopen = function(){
      backoff = 1000;
      ws.send(JSON.stringify({type: "join", room: room}));
      status.textContent = "pairing…"; dot.className = "";
    };
    ws.onmessage = function(ev){
      var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.type === "joined"){
        var linked = (m.peers || 0) >= 2;
        dot.className = linked ? "on" : "";
        status.textContent = linked ? "linked" : "pairing…";
      } else if (m.type === "caption" && m.text){
        if (hint) { hint.remove(); hint = null; }
        if (m.final){
          finals.push(m.text);
          if (finals.length > KEEP) finals = finals.slice(-KEEP);
          partial = "";
        } else {
          partial = m.text;
        }
        render();
      }
    };
    ws.onclose = retry;
    ws.onerror = function(){ try { ws.close(); } catch (e) {} };
  }
  function retry(){
    dot.className = "err"; status.textContent = "reconnecting…";
    setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 10000);
  }
  connect();
})();
</script>
</body>
</html>
